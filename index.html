<script>

const $=s=>document.querySelector(s),F=(n,t,o)=>({n,t,o}),
B=[F("اسم الشخصية"),F("العمر","number"),F("اسمك في ديسكورد"),F("اسم ماينكرافت")];
$("#nm").textContent=CONFIG.name;document.querySelectorAll(".dl").forEach(a=>a.href=CONFIG.discord);$("#lg").innerHTML=CONFIG.logo?`<img src="${CONFIG.logo}" alt="">`:"م";
const R=document.documentElement;
try{const s=localStorage.getItem("th");if(s)R.dataset.theme=s}catch(e){}
$("#th").onclick=()=>{const d=getComputedStyle(R).colorScheme==="dark";R.dataset.theme=d?"light":"dark";try{localStorage.setItem("th",R.dataset.theme)}catch(e){}};
function toast(x){const t=$("#t");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function cl(){$("#m").classList.remove("on")}
$("#m").onclick=e=>{if(e.target.id==="m")cl()};
function modal(t,h){$("#m").innerHTML=`<div class="box"><button class="x" onclick="cl()">✕</button><h3>${t}</h3>${h}</div>`;$("#m").classList.add("on")}
function form(t,fs,o={}){
 modal(t,`<form id="f">${fs.map((f,i)=>`<label>${f.n}</label>`+(f.t==="area"?`<textarea name="f${i}" rows="3" required></textarea>`:f.t==="sel"?`<select name="f${i}">${f.o.map(x=>`<option>${x}</option>`).join("")}</select>`:`<input name="f${i}" type="${f.t||"text"}" required>`)).join("")}<button class="btn">${o.fines?"استعلام":"إرسال"}</button></form>`);
 $("#f").onsubmit=e=>{e.preventDefault();const d={};fs.forEach((f,i)=>d[f.n]=e.target["f"+i].value);
  if(o.fines&&d["نوع الطلب"]==="استعلام عن الغرامات"){if(window.lookupFines){lookupFines(d);return}modal("غرامات "+d["اسم الشخصية"],`<p style="color:var(--mut)">نتيجة تجريبية، ستظهر هنا بياناتك الحقيقية بعد ربط قاعدة البيانات.</p><table><tr><th>المخالفة</th><th>المبلغ</th></tr><tr><td>تجاوز السرعة</td><td>500</td></tr><tr><td>وقوف خاطئ</td><td>200</td></tr><tr><th>الإجمالي</th><th>700</th></tr></table>`);return}
  if(o.permit&&window.savePermit)savePermit(o.permit,t,d);
  if(CONFIG.api)fetch(CONFIG.api,{method:"POST",headers:{"Content-Type":"application/json",...(CONFIG.h||{})},body:JSON.stringify({form:t,data:d})}).catch(()=>{});
  cl();toast("تم إرسال طلبك ✔"+(CONFIG.api?"":" (نسخة تجريبية)"))}}
const citizen=()=>form("التقديم على السيرفر",[...B,F("الجنسية"),F("سبب الدخول","sel",["مواطنة","سياحة","زيارة"])]);
const sectorForm=s=>form("التقديم على قطاع "+s.n,[...B,...s.f.map(q=>F(q,"area"))]);
const SRV={
 traffic:()=>form("خدمات المرور",[...B.slice(0,1),B[3],F("نوع الطلب","sel",["ترخيص مركبة جديدة","تجديد ترخيص","استعلام عن الغرامات"]),F("رقم العربية")].map((f,i)=>f),{fines:1}),
 civil:()=>form("خدمات الأحوال المدنية",[...B,F("نوع الطلب","sel",["إصدار هوية جديدة","تجديد الهوية","استخراج بدل فاقد","تعديل بيانات"]),F("ملاحظات","area")]),
 report:()=>form("تقديم بلاغ",[F("اسم المبلّغ"),F("اسمك في ديسكورد"),F("نوع البلاغ","sel",["سرقة","اعتداء","حادث مروري","إزعاج","أخرى"]),F("مكان الحادثة (إحداثيات/منطقة)"),F("تفاصيل البلاغ","area")])};
const IC={shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',health:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',city:'<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/>',gang:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.5 4.5 5"/>',media:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',mech:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',traffic:'<rect x="8" y="2" width="8" height="20" rx="3"/><circle cx="12" cy="7" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="17" r="1.2"/>',id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-2 5.5-2 6 0M14 10h4M14 14h4"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',road:'<path d="M8 3L4 21M16 3l4 18M12 4v3M12 11v3M12 18v3"/>'},
I=k=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]||IC.shield}</svg>`;
function go(h){location.hash=h}
function home(){
 document.body.className="";
 $("#app").innerHTML=`<section class="hero"><span class="pill"><i></i>سيرفر ماينكرافت للحياة الواقعية</span><h1>أهلاً بك في <span>${CONFIG.name}</span></h1><p>مجتمع ماينكرافت للحياة الواقعية بالطابع المصري. اختر دورك وابدأ قصتك داخل المدينة.</p>
 <a class="btn dc" href="${CONFIG.discord}" target="_blank" rel="noopener">دخول بديسكورد</a><button class="btn" onclick="citizen()">تقديم مواطنة / سياحة / زيارة</button><a class="btn o" href="${CONFIG.discord}" target="_blank" rel="noopener">انضم لسيرفر ديسكورد</a></section>
 <h2 id="sectors">القطاعات</h2><div class="grid">${CONFIG.sectors.map((s,i)=>`<div class="card sec" style="--c:${s.c}"><div class="ic">${I(s.ic)}</div><h3>${s.n}</h3><p>${s.d}</p><button class="btn" onclick="sectorForm(CONFIG.sectors[${i}])">قدّم الآن</button> ${s.more?`<button class="btn o" style="border-color:${s.c};color:${s.c};background:none" onclick="go('${s.more}')">المزيد</button>`:""}</div>`).join("")}</div>
 <h2 id="rules">القوانين</h2>${CONFIG.rules.map(r=>`<details><summary>${r.t}</summary><ol>${r.l.map(x=>`<li>${x}</li>`).join("")}</ol></details>`).join("")}
 <h2 id="news">آخر الأخبار</h2><div class="grid">${CONFIG.news.map(n=>`<div class="card news">${n.img?`<img src="${n.img}" alt="">`:`<div class="ph"></div>`}<small>${n.d}</small><h3 style="margin-block:2px;font-size:17px">${n.t}</h3><div style="color:var(--mut);font-size:14px">${n.x}</div></div>`).join("")}</div>`}
function police(){
 document.body.className="pol";const P=CONFIG.police;
 $("#app").innerHTML=`<div class="lb"><i></i><i></i></div><section class="ph1"><div class="bd">${I("shield")}</div><h1>الشرطة</h1><p>${P.about}</p><button class="btn" onclick="sectorForm(CONFIG.sectors[0])">التقديم على الشرطة</button> <button class="btn o" onclick="go('')">← الرئيسية</button></section>
 <div id="sx"></div><h2>الرتب</h2><div class="rk">${P.ranks.map((r,i)=>`<span><b>${String(i+1).padStart(2,"0")}</b>${r}</span>`).join("")}</div>
 <h2>أقسام الشرطة</h2><div class="grid">${P.depts.map((d,i)=>`<div class="card pc" style="--c:${d.c}"><div class="ic">${I(d.ic)}</div><h3>${d.n}</h3><p>${d.d}</p><button class="btn" onclick="deptForm(${i})">التقديم على القسم</button>${d.srv?`<button class="btn o" onclick="SRV.${d.srv}()">${{traffic:"خدمات المرور",civil:"خدمات الهوية",report:"تقديم بلاغ"}[d.srv]}</button>`:""}</div>`).join("")}</div><h2>التصاريح</h2><div class="grid">${CONFIG.permits.map((p,i)=>`<div class="card pc" style="--c:${p.c}"><div class="ic">${I(p.ic)}</div><h3>${p.n}</h3><p>${p.d}</p><button class="btn" onclick="permitForm(${i})">قدّم على التصريح</button></div>`).join("")}</div>`}
function permitForm(i){const p=CONFIG.permits[i];form("طلب "+p.n,[...B,...p.q.map(QF)],{permit:"police"})}
const QF=q=>Array.isArray(q)?F(q[0],"sel",q.slice(1)):F(q,"area");
function muniForm(g,i){const p=CONFIG.muni[g].items[i];form("طلب "+p.n,[...B,...p.q.map(QF)],{permit:"municipality"})}
function muni(){document.body.className="mun";
 $("#app").innerHTML=`<section class="ph1"><div class="bd">${I("city")}</div><h1>البلدية</h1><p>${CONFIG.muniAbout}</p><button class="btn" onclick="sectorForm(CONFIG.sectors[2])">التقديم للعمل في البلدية</button> <button class="btn o" onclick="go('')">← الرئيسية</button></section><div id="sx"></div>`+CONFIG.muni.map((g,gi)=>`<h2>${g.t}</h2><div class="grid">${g.items.map((p,i)=>`<div class="card pc" style="--c:${g.c}"><div class="ic">${I(g.ic)}</div><h3>${p.n}</h3><p>${p.d}</p><button class="btn" onclick="muniForm(${gi},${i})">${g.btn||"قدّم الطلب"}</button></div>`).join("")}</div>`).join("")}
function deptForm(i){const d=CONFIG.police.depts[i];form("التقديم على "+d.n,[...B,...d.q.map(q=>F(q,"area"))])}
function route(){window.scrollTo(0,0);const h=location.hash.slice(1);if(h==="police")police();else if(h==="muni")muni();else{home();if(h)setTimeout(()=>{const e=document.getElementById(h);e&&e.scrollIntoView()},50)}}
addEventListener("hashchange",route);route();
</script></body></html>
